plugins {
    id 'com.android.application'
}

dependencies {
    implementation files('libs/sherpa-onnx-1.13.4.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}

android {
    namespace 'com.example.mediaparser'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.example.mediaparser'
        minSdk 29
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
        versionCode 50
        versionName '0.4.10'
    }

    buildTypes {
        release {
            // Keep release builds install-compatible with the existing test-device APK.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging { jniLibs { useLegacyPackaging = true } }

    // This legacy fixture only covered the removed in-app Gemini correction pipeline.
    sourceSets { test { java.exclude '**/GeminiSubtitleSmokeTest.java', '**/LiveGeminiSmoke.java' } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
