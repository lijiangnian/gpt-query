name: Build MediaParser APK

on:
  push:
    branches:
      - media-parser-app-build-20260828
    paths:
      - '.github/workflows/build-media-parser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat media-parser-build/chunk00.b64 media-parser-build/chunk01.b64 media-parser-build/chunk02.b64 media-parser-build/chunk03.b64 > MediaParserApp-source.zip.b64
          base64 -d MediaParserApp-source.zip.b64 > MediaParserApp-source.zip
          echo "c3dcc628ea60dad0bc80c305af500a9c374bd0e3e3077be716bf1d8dc35c91aa  MediaParserApp-source.zip" | sha256sum -c -
          unzip -q MediaParserApp-source.zip
          test -f MediaParserApp/app/build.gradle

      - name: Apply v0.1.2 parser and WebView fixes
        shell: bash
        run: |
          cp media-parser-build/patches/KuaishouParser.java MediaParserApp/app/src/main/java/com/example/mediaparser/parser/KuaishouParser.java
          cp media-parser-build/patches-v012/XhsParser.java MediaParserApp/app/src/main/java/com/example/mediaparser/parser/XhsParser.java
          cp media-parser-build/patches-v012/XhsWebViewActivity.java MediaParserApp/app/src/main/java/com/example/mediaparser/XhsWebViewActivity.java
          cp media-parser-build/patches-v012/AndroidManifest.xml MediaParserApp/app/src/main/AndroidManifest.xml
          patch -d MediaParserApp -p1 < media-parser-build/patches-v012/MainActivity.patch
          sed -Ei 's/versionCode [0-9]+/versionCode 3/' MediaParserApp/app/build.gradle
          sed -Ei "s/versionName '[^']+'/versionName '0.1.2'/" MediaParserApp/app/build.gradle

      - name: Apply v0.1.3 platform audio files
        shell: bash
        run: |
          cp media-parser-build/v013files/build.gradle MediaParserApp/app/build.gradle
          cp media-parser-build/v013files/MediaItem.java MediaParserApp/app/src/main/java/com/example/mediaparser/model/MediaItem.java
          cp media-parser-build/v013files/FileSaver.java MediaParserApp/app/src/main/java/com/example/mediaparser/util/FileSaver.java
          cp media-parser-build/v013files/DouyinParser.java MediaParserApp/app/src/main/java/com/example/mediaparser/parser/DouyinParser.java
          cp media-parser-build/v013files/BilibiliParser.java MediaParserApp/app/src/main/java/com/example/mediaparser/parser/BilibiliParser.java
          cp media-parser-build/v013files/KuaishouParser.java MediaParserApp/app/src/main/java/com/example/mediaparser/parser/KuaishouParser.java
          cp media-parser-build/v013files/XhsParser.java MediaParserApp/app/src/main/java/com/example/mediaparser/parser/XhsParser.java
          cp media-parser-build/v013files/WeiboParser.java MediaParserApp/app/src/main/java/com/example/mediaparser/parser/WeiboParser.java
          patch -d MediaParserApp -p1 < media-parser-build/v013files/MainActivity.patch
          grep -q "versionCode 4" MediaParserApp/app/build.gradle
          grep -q "versionName '0.1.3'" MediaParserApp/app/build.gradle
          grep -q 'EXTRACT_AUDIO_TRACK' MediaParserApp/app/src/main/java/com/example/mediaparser/model/MediaItem.java
          grep -q 'MediaExtractor' MediaParserApp/app/src/main/java/com/example/mediaparser/util/FileSaver.java
          grep -q '平台原声/配乐' MediaParserApp/app/src/main/java/com/example/mediaparser/parser/DouyinParser.java
          grep -q 'dash' MediaParserApp/app/src/main/java/com/example/mediaparser/parser/BilibiliParser.java

      - name: Apply v0.1.4 audio folder UI
        shell: bash
        run: |
          patch -d MediaParserApp -p1 < media-parser-build/v014/MainActivity.patch
          sed -Ei 's/versionCode [0-9]+/versionCode 5/' MediaParserApp/app/build.gradle
          sed -Ei "s/versionName '[^']+'/versionName '0.1.4'/" MediaParserApp/app/build.gradle
          grep -q 'secondaryButton("打开文件夹")' MediaParserApp/app/src/main/java/com/example/mediaparser/MainActivity.java
          grep -q 'saveLabel = "提取"' MediaParserApp/app/src/main/java/com/example/mediaparser/MainActivity.java
          grep -q 'Music/MediaParser' MediaParserApp/app/src/main/java/com/example/mediaparser/MainActivity.java
          grep -q "versionCode 5" MediaParserApp/app/build.gradle
          grep -q "versionName '0.1.4'" MediaParserApp/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: MediaParserApp
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s MediaParserApp/app/build/outputs/apk/debug/app-debug.apk
          sha256sum MediaParserApp/app/build/outputs/apk/debug/app-debug.apk
          ls -lh MediaParserApp/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaParser-v0.1.4-debug
          path: MediaParserApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Download org.json for exact parser smoke
        shell: bash
        run: curl -fsSL --retry 3 -o json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar

      - name: Compile exact parser sources
        shell: bash
        run: |
          mkdir -p live-classes
          javac -encoding UTF-8 -cp json.jar -d live-classes \
            MediaParserApp/app/src/main/java/com/example/mediaparser/model/*.java \
            MediaParserApp/app/src/main/java/com/example/mediaparser/core/*.java \
            MediaParserApp/app/src/main/java/com/example/mediaparser/net/*.java \
            MediaParserApp/app/src/main/java/com/example/mediaparser/parser/*.java \
            MediaParserApp/app/src/main/java/com/example/mediaparser/util/JsonUtil.java \
            media-parser-build/LiveParserMain.java

      - name: Run five-platform live smoke
        continue-on-error: true
        shell: bash
        run: java -cp live-classes:json.jar LiveParserMain | tee live-parser-results.txt

      - name: Upload live parser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MediaParser-v0.1.4-live-results
          path: live-parser-results.txt
          if-no-files-found: warn
          retention-days: 7
