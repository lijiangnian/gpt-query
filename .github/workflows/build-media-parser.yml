name: Build MediaParser APK

on:
  push:
    branches:
      - media-parser-app-build-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat media-parser-build/chunk00.b64 media-parser-build/chunk01.b64 media-parser-build/chunk02.b64 media-parser-build/chunk03.b64 > MediaParserApp-source.zip.b64
          base64 -d MediaParserApp-source.zip.b64 > MediaParserApp-source.zip
          echo "c3dcc628ea60dad0bc80c305af500a9c374bd0e3e3077be716bf1d8dc35c91aa  MediaParserApp-source.zip" | sha256sum -c -
          unzip -q MediaParserApp-source.zip
          test -f MediaParserApp/app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: MediaParserApp
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s MediaParserApp/app/build/outputs/apk/debug/app-debug.apk
          sha256sum MediaParserApp/app/build/outputs/apk/debug/app-debug.apk
          ls -lh MediaParserApp/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaParser-v0.1-debug
          path: MediaParserApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
