name: Build MediaParser Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'MediaParserApp/**'
      - '.github/workflows/mediaparser-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MediaParserApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build APK
        run: gradle testReleaseUnitTest assembleDebug lintVitalRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MediaParser-debug-apk
          path: MediaParserApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
