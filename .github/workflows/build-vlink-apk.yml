name: Build VLink APK

on:
  push:
    branches: ["vlink-android"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VLink-Converter-v1.1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VLink-Converter-APK
          path: VLink-Converter-v1.1.0-debug.apk
          retention-days: 30
