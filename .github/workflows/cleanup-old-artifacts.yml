          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          deleted = []
          for item in expected:
              url = "https://api.github.com/repos/" + repository + "/actions/artifacts/" + str(item["id"])
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                      actual = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      print("Already absent:", item["id"])
                      continue
                  raise
              assert actual["name"] == item["name"], ("Name changed", item["id"])
              assert actual["size_in_bytes"] == item["size"], ("Size changed", item["id"])
              assert actual["created_at"] == item["created_at"], ("Creation time changed", item["id"])
              assert not any(word in actual["name"].lower() for word in ["signing-backup", "keystore", "credential", "recovery", "private-key"])
