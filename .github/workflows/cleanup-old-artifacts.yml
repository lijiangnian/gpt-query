                  assert response.status == 204
              deleted.append(item)
              print("DELETED", item["id"], item["size"], item["name"], flush=True)
          result = {"repository": repository, "deleted_count": len(deleted), "deleted_bytes": sum(x["size"] for x in deleted)}
