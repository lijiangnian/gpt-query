name: Live MediaParser Smoke

on:
  push:
    branches:
      - media-parser-app-build-20260828
    paths:
      - 'media-parser-build/LiveParserMain.java'
      - '.github/workflows/live-media-parser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact app source
        shell: bash
        run: |
          cat media-parser-build/chunk00.b64 media-parser-build/chunk01.b64 media-parser-build/chunk02.b64 media-parser-build/chunk03.b64 > MediaParserApp-source.zip.b64
          base64 -d MediaParserApp-source.zip.b64 > MediaParserApp-source.zip
          echo "c3dcc628ea60dad0bc80c305af500a9c374bd0e3e3077be716bf1d8dc35c91aa  MediaParserApp-source.zip" | sha256sum -c -
          unzip -q MediaParserApp-source.zip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download org.json
        shell: bash
        run: curl -fsSL --retry 3 -o json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar

      - name: Compile exact parser sources
        shell: bash
        run: |
          mkdir -p live-classes
          javac -encoding UTF-8 -cp json.jar -d live-classes \
            MediaParserApp/app/src/main/java/com/example/mediaparser/model/*.java \
            MediaParserApp/app/src/main/java/com/example/mediaparser/core/*.java \
            MediaParserApp/app/src/main/java/com/example/mediaparser/net/*.java \
            MediaParserApp/app/src/main/java/com/example/mediaparser/parser/*.java \
            MediaParserApp/app/src/main/java/com/example/mediaparser/util/JsonUtil.java \
            media-parser-build/LiveParserMain.java

      - name: Run five-platform live smoke
        shell: bash
        run: java -cp live-classes:json.jar LiveParserMain | tee live-parser-results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MediaParser-live-results
          path: live-parser-results.txt
          if-no-files-found: warn
          retention-days: 7
