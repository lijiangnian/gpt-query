name: Build Xiaomi Screenshot Assistant APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'xiaomi-screenshot-assistant/**'
      - '.github/workflows/build-xiaomi-screenshot-assistant.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project
        run: |
          base64 -d xiaomi-screenshot-assistant/project.tar.gz.b64 > /tmp/xiaomi-src.tar.gz
          tar -xzf /tmp/xiaomi-src.tar.gz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: xiaomi-screenshot-assistant
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-screenshot-assistant-debug
          path: xiaomi-screenshot-assistant/app/build/outputs/apk/debug/app-debug.apk
