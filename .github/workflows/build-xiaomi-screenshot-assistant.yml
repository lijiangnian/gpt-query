name: Build Xiaomi Screenshot Assistant AI APK

on:
  push:
    branches: [xiaomi-screenshot-assistant-v1]
    paths:
      - 'xiaomi-screenshot-assistant/chunks/**'
      - '.github/workflows/build-xiaomi-screenshot-assistant.yml'
  pull_request:
    branches: [main]
    paths:
      - 'xiaomi-screenshot-assistant/chunks/**'
      - '.github/workflows/build-xiaomi-screenshot-assistant.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore v1.1 Android project
        run: |
          cat xiaomi-screenshot-assistant/chunks/*.b64 | base64 -d > /tmp/xiaomi-v11.tar.gz
          gzip -t /tmp/xiaomi-v11.tar.gz
          rm -rf xiaomi-screenshot-assistant-v1.1
          tar -xzf /tmp/xiaomi-v11.tar.gz
      - name: Apply source compile fix
        run: |
          sed -i 's/textSize = 15f; singleLine = true; inputType =/textSize = 15f; setSingleLine(true); inputType =/' xiaomi-screenshot-assistant-v1.1/app/src/main/java/com/vsme/screenshotassistant/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build arm64 release APK
        working-directory: xiaomi-screenshot-assistant-v1.1
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-screenshot-assistant-v1.1-ai-arm64
          path: xiaomi-screenshot-assistant-v1.1/app/build/outputs/apk/release/app-release.apk
