name: Build Xiaomi Screenshot Assistant APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'xiaomi-screenshot-assistant/**'
      - '.github/workflows/build-xiaomi-screenshot-assistant.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project
        run: |
          cat xiaomi-screenshot-assistant/chunks/*.b64 | base64 -d > /tmp/xiaomi-src.tar.gz
          gzip -t /tmp/xiaomi-src.tar.gz
          tar -xzf /tmp/xiaomi-src.tar.gz
      - name: Apply compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('xiaomi-screenshot-assistant/app/src/main/java/com/vsme/screenshotassistant/MainActivity.kt')
          s = p.read_text()
          s = s.replace('background = Color.rgb(247, 247, 248)', 'setBackgroundColor(Color.rgb(247, 247, 248))')
          p.write_text(s)

          p = Path('xiaomi-screenshot-assistant/app/src/main/java/com/vsme/screenshotassistant/TranslationEngine.kt')
          s = p.read_text()
          s = s.replace('import com.google.mlkit.nl.translate.DownloadConditions\n', '')
          s = s.replace('                val conditions = DownloadConditions.Builder().build()\n\n                translator.downloadModelIfNeeded(conditions)', '                translator.downloadModelIfNeeded()')
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: xiaomi-screenshot-assistant
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-screenshot-assistant-debug
          path: xiaomi-screenshot-assistant/app/build/outputs/apk/debug/app-debug.apk
