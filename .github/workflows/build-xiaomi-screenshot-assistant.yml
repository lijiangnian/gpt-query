name: Build Xiaomi Screenshot Assistant APK

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-xiaomi-screenshot-assistant.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore v1.1 Android project
        run: |
          cat > /tmp/project.b64 <<'B64'

B64
          base64 -d /tmp/project.b64 > /tmp/project.tar.gz
          gzip -t /tmp/project.tar.gz
          rm -rf xiaomi-screenshot-assistant
          tar -xzf /tmp/project.tar.gz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build arm64 release APK
        working-directory: xiaomi-screenshot-assistant
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-screenshot-assistant-v1.1-arm64
          path: xiaomi-screenshot-assistant/app/build/outputs/apk/release/app-release.apk
