name: Inspect Xiaomi Screenshot Assistant v1.4 Source

on:
  push:
    branches: [xiaomi-screenshot-assistant-v1]
    paths:
      - '.github/workflows/inspect-xiaomi-screenshot-assistant.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project
        run: |
          cat xiaomi-screenshot-assistant/chunks/*.b64 | base64 -d > /tmp/xiaomi-src.tar.gz
          gzip -t /tmp/xiaomi-src.tar.gz
          rm -rf xiaomi-screenshot-assistant-v1.1
          tar -xzf /tmp/xiaomi-src.tar.gz
      - name: Apply v1.4 patch
        run: python3 xiaomi-screenshot-assistant/patch_v14.py
      - name: Print project structure and relevant source
        run: |
          echo '===== FILES ====='
          find xiaomi-screenshot-assistant-v1.1/app/src/main -maxdepth 8 -type f | sort
          echo '===== MANIFEST ====='
          cat xiaomi-screenshot-assistant-v1.1/app/src/main/AndroidManifest.xml
          echo '===== MAIN ACTIVITY ====='
          cat xiaomi-screenshot-assistant-v1.1/app/src/main/java/com/vsme/screenshotassistant/MainActivity.kt
          echo '===== APP BUILD.GRADLE ====='
          cat xiaomi-screenshot-assistant-v1.1/app/build.gradle.kts 2>/dev/null || cat xiaomi-screenshot-assistant-v1.1/app/build.gradle 2>/dev/null || true
